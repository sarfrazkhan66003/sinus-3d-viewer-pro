
# ============================================================
# SINUS VIEWER
# Root Python Project Configuration
# ============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sinus-viewer"
version = "0.1.0"
description = "Modular DICOM CBCT/CT visualization web platform"
readme = "README.md"
requires-python = ">=3.10,<3.14"

authors = [
    { name = "Sinus Viewer Development Team" }
]

keywords = [
    "dicom",
    "cbct",
    "ct",
    "medical-imaging",
    "sinus",
    "volume-rendering",
    "fastapi",
    "cornerstone3d"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps"
]

# Backend runtime dependencies are managed separately
# in backend/requirements.txt.
dependencies = []

[project.optional-dependencies]

dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.9,<1.0"
]

[tool.setuptools]
packages = []

# ============================================================
# PYTEST CONFIGURATION
# ============================================================

[tool.pytest.ini_options]

testpaths = [
    "tests/backend"
]

python_files = [
    "test_*.py"
]

python_functions = [
    "test_*"
]

addopts = [
    "-ra",
    "--strict-markers"
]

asyncio_mode = "auto"

markers = [
    "unit: Isolated unit tests",
    "integration: API and component integration tests",
    "dicom: DICOM parsing and image tests",
    "security: Security and path validation tests",
    "slow: Resource-intensive tests"
]

# ============================================================
# RUFF LINTING CONFIGURATION
# ============================================================

[tool.ruff]

target-version = "py310"
line-length = 100

exclude = [
    ".git",
    ".venv",
    "node_modules",
    "dist",
    "build",
    "runtime",
    "__pycache__"
]

[tool.ruff.lint]

select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP"
]

ignore = [
    "E501"
]

[tool.ruff.format]

quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ============================================================
# COVERAGE CONFIGURATION
# ============================================================

[tool.coverage.run]

source = [
    "backend/app"
]

branch = true

omit = [
    "*/__init__.py",
    "*/tests/*"
]

[tool.coverage.report]

show_missing = true
skip_empty = true

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]

# ============================================================
# MYPY CONFIGURATION
# ============================================================

[tool.mypy]

python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
